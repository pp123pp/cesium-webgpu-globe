<!doctype html><meta charset="utf-8"><title>fixed-1080</title><style>body{background:#111;color:#eee;font:16px system-ui}img{max-width:100%}input{width:70%}</style><h1>fixed-1080</h1><p>Original WebGPU captures; playback speed is an inspection aid.</p><button id="play">Play / pause</button><input id="seek" type="range" min="0" max="7" value="0"><p id="label"></p><img id="image"><script>let i=0,t;const frames=[{"filename":"frame-0000.png","index":0},{"filename":"frame-0001.png","index":1},{"filename":"frame-0002.png","index":2},{"filename":"frame-0003.png","index":3},{"filename":"frame-0004.png","index":4},{"filename":"frame-0005.png","index":5},{"filename":"frame-0006.png","index":6},{"filename":"frame-0007.png","index":7}];function show(){document.getElementById('image').src=frames[i].filename;document.getElementById('seek').value=i;document.getElementById('label').textContent='Frame '.concat(i)}document.getElementById('seek').oninput=e=>{i=+e.target.value;show()};document.getElementById('play').onclick=()=>{if(t){clearInterval(t);t=null}else{t=setInterval(()=>{i=(i+1)%frames.length;show()},100)}};show()</script>
