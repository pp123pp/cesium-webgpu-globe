<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Cesium M0.4 WebGPU proof</title>
    <script src="../Build/CesiumUnminified/Cesium.js"></script>
    <style>
      html,
      body,
      #cesiumContainer {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
      }
      body {
        background: #0a0f1a;
        color: #e3eaf4;
        font:
          15px system-ui,
          sans-serif;
      }
      aside {
        position: absolute;
        top: 24px;
        left: 24px;
        max-width: 460px;
        pointer-events: none;
      }
      h1 {
        font-size: 22px;
        margin: 0 0 8px;
      }
      p {
        line-height: 1.5;
      }
      #status {
        white-space: pre-wrap;
        color: #9ed8bc;
      }
    </style>
  </head>
  <body>
    <div id="cesiumContainer"></div>
    <aside>
      <h1>M0.4 · WebGPU proof</h1>
      <p>
        Color clear, WGSL triangle, and depth testing. Experimental canvas
        lifecycle only. Globe, terrain, imagery, and the Cesium Scene API are
        outside this proof.
      </p>
      <p id="status">Requesting a WebGPU adapter and device…</p>
    </aside>
    <script type="module">
      /* global Cesium */
      const status = document.getElementById("status");
      const viewer = new Cesium.Viewer("cesiumContainer", {
        renderingBackend: "webgpu",
        globe: false,
      });
      const showError = (error) => {
        status.style.color = "#ffb4b4";
        status.textContent = String(error);
      };
      viewer.renderError.addEventListener((source, error) => showError(error));
      try {
        await viewer.readyPromise;
        status.textContent =
          "WebGPU ready · resize the window to test the depth attachment.";
      } catch (error) {
        showError(error);
      }
      window.addEventListener("pagehide", () => viewer.destroy(), {
        once: true,
      });
    </script>
  </body>
</html>
