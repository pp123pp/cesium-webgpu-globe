name: Import pinned CesiumJS 1.146 source

# One-time, guarded upstream import. Both triggers are supported:
# push activates on initial workflow commit; workflow_dispatch supports manual retry.
on:
  push:
    paths:
      - .github/workflows/import-cesium.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cesium-upstream-import
  cancel-in-progress: false

jobs:
  import:
    if: github.repository == 'pp123pp/cesium-webgpu-globe'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout project
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 1

      - name: Ensure source has not already been imported
        shell: bash
        run: |
          set -euo pipefail
          if [[ -e package.json || -e packages/engine/package.json ]]; then
            echo 'Cesium source already exists. Refusing to overwrite it.'
            exit 1
          fi
          test -f AGENTS.md
          test -f ROADMAP.md

      - name: Clone and verify exact upstream CesiumJS commit
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth=1 --single-branch --branch 1.146 https://github.com/CesiumGS/cesium.git "$RUNNER_TEMP/cesium-upstream"
          actual="$(git -C "$RUNNER_TEMP/cesium-upstream" rev-parse HEAD)"
          expected='b8d3a36fe98a3e432eb89253c95d5f20e605e0f1'
          echo "Upstream commit: $actual"
          test "$actual" = "$expected"
          echo "CESIUM_SHA=$actual" >> "$GITHUB_ENV"

      - name: Copy upstream monorepo to repository root
        shell: bash
        run: |
          set -euo pipefail
          # Exclude upstream Git metadata and CI workflow definitions.
          # Protect existing Codex project controls.
          rsync -a "$RUNNER_TEMP/cesium-upstream/" ./ \
            --exclude='/.git/' \
            --exclude='/.github/' \
            --exclude='/AGENTS.md' \
            --exclude='/README.md' \
            --exclude='/GOALS.md' \
            --exclude='/ROADMAP.md' \
            --exclude='/.gitignore' \
            --exclude='/coordination/' \
            --exclude='/tasks/'
          # Carry across upstream ignore rules; retain existing project-specific ignores.
          cat "$RUNNER_TEMP/cesium-upstream/.gitignore" >> .gitignore
          cp "$RUNNER_TEMP/cesium-upstream/README.md" docs/UPSTREAM_CESIUM_README.md
          test -f package.json
          test -f packages/engine/package.json
          test -f LICENSE.md || test -f LICENSE
          mkdir -p coordination
          printf 'Upstream source: CesiumGS/cesium\nTag: 1.146\nCommit: %s\nImported via: .github/workflows/import-cesium.yml\n' "$CESIUM_SHA" > coordination/UPSTREAM_REVISION.txt

      - name: Commit and push imported source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          if git diff --cached --quiet; then
            echo "No changes to import."
            exit 0
          fi
          git commit -m "chore: import official CesiumJS 1.146 at ${CESIUM_SHA:0:12}"
          git push origin HEAD:main
