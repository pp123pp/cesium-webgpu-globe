name: M1 Full regression

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review, labeled]
  # GitHub only delivers this event once this file exists on the default branch.
  # Until then, add the ci:full PR label. See docs/CI.md.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # An unrelated label must not cancel a real Full run for the same PR.
  group: m1-full-${{ github.event_name == 'pull_request' && github.event.action == 'labeled' && github.event.label.name != 'ci:full' && format('ignored-label-{0}', github.run_id) || github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  select:
    name: Select Full regression
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      run_full: ${{ steps.policy.outputs.run_full }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Select Full from this update and PR state
        id: policy
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p Build/m1-ci
          node coordination/ci/m1-ci-policy.mjs | tee Build/m1-ci/full-selection.json

      - name: Upload selection evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m1-full-selection
          path: Build/m1-ci/full-selection.json
          if-no-files-found: warn

  regression:
    name: Full regression
    needs: select
    if: ${{ needs.select.outputs.run_full == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      CI: "true"
      NPM_CONFIG_AUDIT: "false"
      NPM_CONFIG_FUND: "false"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Check out the pinned pre-WebGPU comparison source
        uses: actions/checkout@v4
        with:
          ref: 724b5db8f258d0ce00c4f6b774bd38529e24252b
          path: Build/m0-reference-source

      - name: Node 22 and npm workspaces
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Verify pinned source and record versions
        shell: bash
        run: |
          set -euo pipefail
          node --version
          npm --version
          test -f LICENSE.md
          test -f packages/engine/Source/Scene/Globe.js
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          const p = JSON.parse(readFileSync('package.json'));
          assert.equal(p.version, '1.146.0');
          assert.deepEqual(p.workspaces, [
            'packages/core', 'packages/engine',
            'packages/widgets', 'packages/sandcastle',
          ]);
          assert.match(readFileSync('coordination/UPSTREAM_REVISION.txt', 'utf8'), /b8d3a36fe98a3e432eb89253c95d5f20e605e0f1/);
          NODE

      - name: Install unmodified upstream npm dependencies
        run: npm install --no-audit --no-fund

      - name: Build official Cesium WebGL bundle
        run: npm run build

      - name: Check M1 and M2 source and generated TypeScript APIs
        run: |
          npx eslint packages/engine/Source/Renderer/WebGPU*.js packages/engine/Source/Scene/WebGPU*.js packages/engine/Source/Scene/TerrainFillMesh.js packages/engine/Source/Scene/QuadtreePrimitive.js packages/engine/Source/Widget/WebGPUWidget.js packages/widgets/Source/Viewer/Viewer.js coordination/ci/m1-*.mjs coordination/ci/m2-*.mjs Apps/WebGPUGlobe.html
          npm run build-ts
          npm exec --package=typescript --offline -- tsc --project packages/sandcastle/templates/tsconfig.lib.json
          npm run tsc

      - name: Build independent pre-WebGPU comparison bundle
        working-directory: Build/m0-reference-source
        run: |
          npm install --include-workspace-root --workspace packages/core --workspace packages/engine --workspace packages/widgets --no-audit --no-fund
          npm run build

      - name: Run focused M0 and all M1 and M2 unit tests
        run: |
          node coordination/ci/m0-webgpu-unit.test.mjs
          node coordination/ci/m0-visual-checks.test.mjs
          node coordination/ci/m0-browser-config.test.mjs
          node coordination/ci/m0-webgl-regression.test.mjs
          for test in coordination/ci/m1-*.test.mjs coordination/ci/m2-*.test.mjs; do
            node "$test"
          done

      - name: Install Chromium for real browser smoke
        run: npx playwright install --with-deps chromium

      - name: Compare visible WebGL Globe with pre-WebGPU reference
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p Build/m0-baseline
          npm run start -- --production > "$RUNNER_TEMP/m0-server.log" 2>&1 &
          server_pid=$!
          trap 'cp "$RUNNER_TEMP/m0-server.log" Build/m0-baseline/server.log || true; kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in {1..60}; do
            if curl --fail --silent http://localhost:8080/Specs/e2e/cesium.html > /dev/null; then break; fi
            sleep 1
          done
          xvfb-run --auto-servernum node coordination/ci/m0-webgl-smoke.mjs
          if M0_NEGATIVE_CONTROL=missing-globe M0_WEBGL_OUTPUT=Build/m0-negative xvfb-run --auto-servernum node coordination/ci/m0-webgl-smoke.mjs; then
            echo 'Missing-Globe negative control unexpectedly passed'
            exit 1
          fi
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          const result = JSON.parse(readFileSync('Build/m0-negative/webgl-smoke-error.json'));
          assert.match(result.error, /Globe center surface missing/);
          NODE

      - name: Run upstream non-WebGL unit tests
        shell: bash
        run: |
          set -euo pipefail
          export CHROME_BIN
          chmod +x coordination/ci/m0-chrome.cjs
          CHROME_BIN="$PWD/coordination/ci/m0-chrome.cjs"
          npm run test-non-webgl -- --browsers ChromeHeadless --failTaskOnError

      - name: Compare complete upstream WebGL suite with pre-WebGPU baseline
        shell: bash
        run: |
          set -euo pipefail
          export CHROME_BIN="$PWD/coordination/ci/m0-chrome.cjs"
          node coordination/ci/m0-webgl-regression.mjs --baseline "$PWD/Build/m0-reference-source" --output Build/m0-webgl-regression

      - name: Run M0 WebGPU and M1 globe, imagery and navigation gates
        if: ${{ !cancelled() }}
        env:
          DEBUG: pw:browser
        shell: bash
        run: |
          set -euo pipefail
          npm run start -- --production > "$RUNNER_TEMP/m0-webgpu-server.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in {1..60}; do
            if curl --fail --silent http://localhost:8080/Specs/e2e/cesium.html > /dev/null; then break; fi
            sleep 1
          done
          xvfb-run --auto-servernum node coordination/ci/m0-webgpu-smoke.mjs
          M1_BASE_URL=http://localhost:8080/ xvfb-run --auto-servernum node coordination/ci/m1-globe-smoke.mjs
          M1_BASE_URL=http://localhost:8080/ xvfb-run --auto-servernum node coordination/ci/m1-imagery-smoke.mjs
          M1_BASE_URL=http://localhost:8080/ xvfb-run --auto-servernum node coordination/ci/m1-navigation-smoke.mjs
          M1_BASE_URL=http://localhost:8080/ xvfb-run --auto-servernum node coordination/ci/m2-foundation-smoke.mjs
          M1_BASE_URL=http://localhost:8080/ xvfb-run --auto-servernum node coordination/ci/m2-atmosphere-smoke.mjs
          M1_BASE_URL=http://localhost:8080/ xvfb-run --auto-servernum node coordination/ci/m2-sun-smoke.mjs

      - name: Run live M1 terrain and near-ground flight acceptance
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p Build/m1-terrain
          python3 -m http.server 8090 --bind 127.0.0.1 > "$RUNNER_TEMP/m1-terrain-server.log" 2>&1 &
          server_pid=$!
          trap 'cp "$RUNNER_TEMP/m1-terrain-server.log" Build/m1-terrain/server.log || true; kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:8090/Specs/e2e/cesium.html > /dev/null; then break; fi
            sleep 1
          done
          M1_BASE_URL=http://127.0.0.1:8090/ xvfb-run --auto-servernum node coordination/ci/m1-terrain-smoke.mjs 2>&1 | tee Build/m1-terrain/run.log

      - name: Run live M1 demonstration and error lifecycle acceptance
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p Build/m1-demo
          python3 -m http.server 8091 --bind 127.0.0.1 > "$RUNNER_TEMP/m1-demo-server.log" 2>&1 &
          server_pid=$!
          trap 'cp "$RUNNER_TEMP/m1-demo-server.log" Build/m1-demo/server.log || true; kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:8091/Apps/WebGPUGlobe.html > /dev/null; then break; fi
            sleep 1
          done
          M1_BASE_URL=http://127.0.0.1:8091/ xvfb-run --auto-servernum node coordination/ci/m1-demo-smoke.mjs 2>&1 | tee Build/m1-demo/run.log

      - name: Upload full regression evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m1-full-regression
          path: |
            Build/m0-baseline/
            Build/m0-webgpu/
            Build/m0-negative/
            Build/m0-webgl-regression/
            Build/m1-globe/
            Build/m1-imagery/
            Build/m1-navigation/
            Build/m1-terrain/
            Build/m1-demo/
            Build/m2-foundation/
            Build/m2-atmosphere/
            Build/m2-sun/
          if-no-files-found: warn
