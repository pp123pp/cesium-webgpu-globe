name: M1 Fast CI

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: read

concurrency:
  group: m1-fast-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  fast:
    name: Fast CI
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CI: "true"
      NPM_CONFIG_AUDIT: "false"
      NPM_CONFIG_FUND: "false"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Node 22 and npm workspaces
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Verify pinned source and record versions
        shell: bash
        run: |
          set -euo pipefail
          node --version
          npm --version
          test -f LICENSE.md
          test -f packages/engine/Source/Scene/Globe.js
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          const p = JSON.parse(readFileSync('package.json'));
          assert.equal(p.version, '1.146.0');
          assert.deepEqual(p.workspaces, [
            'packages/core', 'packages/engine',
            'packages/widgets', 'packages/sandcastle',
          ]);
          assert.match(readFileSync('coordination/UPSTREAM_REVISION.txt', 'utf8'), /b8d3a36fe98a3e432eb89253c95d5f20e605e0f1/);
          NODE

      - name: Install unmodified upstream npm dependencies
        run: npm install --no-audit --no-fund

      - name: Build official Cesium WebGL bundle
        run: npm run build

      - name: Check M1 and M2 source and generated TypeScript APIs
        run: |
          npx eslint packages/engine/Source/Renderer/WebGPU*.js packages/engine/Source/Scene/WebGPU*.js packages/engine/Source/Scene/TerrainFillMesh.js packages/engine/Source/Scene/QuadtreePrimitive.js packages/engine/Source/Widget/WebGPUWidget.js packages/widgets/Source/Viewer/Viewer.js coordination/ci/m1-*.mjs coordination/ci/m2-*.mjs coordination/ci/m3-*.mjs coordination/ci/m2.6.1-b5-a-remediation-smoke.mjs Apps/WebGPUGlobe.html Apps/WebGPUCloudGeometry.js
          npm run build-ts
          npm exec --package=typescript --offline -- tsc --project packages/sandcastle/templates/tsconfig.lib.json
          npm run tsc

      - name: Run focused M0 and all M1 and M2 unit tests
        run: |
          node coordination/ci/m0-webgpu-unit.test.mjs
          node coordination/ci/m0-visual-checks.test.mjs
          node coordination/ci/m0-browser-config.test.mjs
          node coordination/ci/m0-webgl-regression.test.mjs
          for test in coordination/ci/m1-*.test.mjs coordination/ci/m2-*.test.mjs coordination/ci/m3-*.test.mjs; do
            node "$test"
          done
